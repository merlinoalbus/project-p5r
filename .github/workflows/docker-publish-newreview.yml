# ============================================================
# Build & Push Docker Images — istanza parallela p5s (branch newreview)
# ============================================================
# Push su newreview → immagini :newreview + :newreview-<sha> su ghcr.io, le stesse due immagini della produzione con un tag
# diverso: `:latest` (main → https://persona5royal.nasmerlinoalbus.cloud) non viene mai toccato. Sull'host lo stack separato
# `docker-compose.p5s.yml` usa `:newreview` e il watchtower globale lo aggiorna come la produzione (mandato dell'utente del
# 2026-10-20, DECISIONI.md). Stesso gate della produzione (ci.yml) prima di entrambe le build.

name: Build & Push Docker Images (newreview)

on:
  push:
    branches: [newreview]

env:
  REGISTRY: ghcr.io
  BE_IMAGE: ghcr.io/merlinoalbus/project-p5r-backend
  FE_IMAGE: ghcr.io/merlinoalbus/project-p5r-frontend

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          # cache propria del branch: non sovrascrive quella delle immagini di produzione
          cache-from: type=gha,scope=backend-newreview
          cache-to: type=gha,mode=max,scope=backend-newreview
          tags: |
            ${{ env.BE_IMAGE }}:newreview
            ${{ env.BE_IMAGE }}:newreview-${{ github.sha }}

  build-frontend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          cache-from: type=gha,scope=frontend-newreview
          cache-to: type=gha,mode=max,scope=frontend-newreview
          tags: |
            ${{ env.FE_IMAGE }}:newreview
            ${{ env.FE_IMAGE }}:newreview-${{ github.sha }}
