# ============================================================
# Build & Push Docker Images — GHCR (deploy pull-based)
# ============================================================
# Push su main → immagini :latest + :sha su ghcr.io. Sull'host il
# watchtower esterno rileva il nuovo :latest e aggiorna i container
# etichettati nel docker-compose.yml (stack Portainer dal repo).
#
# Le immagini vengono pubblicate SOLO se il gate CI è verde: il job
# `verify` è un prerequisito di entrambe le build.

name: Build & Push Docker Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BE_IMAGE: ghcr.io/merlinoalbus/project-p5r-backend
  FE_IMAGE: ghcr.io/merlinoalbus/project-p5r-frontend

jobs:
  # lo stesso gate delle pull request (ci.yml), audit compreso: una sola definizione (rilievo D7)
  verify:
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          # cache separate per le due immagini: con la stessa si sovrascrivevano a vicenda (rilievo D8)
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.BE_IMAGE }}:latest
            ${{ env.BE_IMAGE }}:${{ github.sha }}

  build-frontend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.FE_IMAGE }}:latest
            ${{ env.FE_IMAGE }}:${{ github.sha }}
