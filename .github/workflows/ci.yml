# ============================================================
# CI — gate di verifica (typecheck + lint + test + audit)
# ============================================================
# Ogni PR e ogni push su main passano dal gate; la pubblicazione delle
# immagini è demandata a docker-publish.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b su app + node + server + test)
        run: npm run typecheck

      - name: Lint (strict su server/)
        run: npm run lint:ci

      - name: Lint (intero repo, informativo)
        run: npm run lint
        continue-on-error: true

      - name: Tests (Vitest — BE + FE + shared)
        run: npm test

      - name: Audit dipendenze runtime (high+ bloccante)
        run: npm audit --omit=dev --audit-level=high
