# ============================================================
# CI — gate di verifica (typecheck + lint + test + audit)
# ============================================================
# Il gate gira sulle PULL REQUEST e, come workflow riusabile (`workflow_call`), prima della pubblicazione delle immagini
# (docker-publish.yml, al push su main): un solo gate, scritto una volta, con l'audit anche lì. Prima la pubblicazione ne
# aveva una copia senza audit, e questo commento diceva che non serviva (rilievo D7 della verifica completa, 2026-10-04).

name: CI

on:
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b su app + node + server + test)
        run: npm run typecheck

      # Un lint solo, bloccante, sull'intero repo: `lint` e `lint:ci` erano lo stesso comando e giravano due volte, una
      # «strict su server/» e una «informativa» (rilievo D6).
      - name: Lint
        run: npm run lint

      - name: Tests (Vitest — BE + FE + shared)
        run: npm test

      - name: Audit dipendenze runtime (high+ bloccante)
        run: npm audit --omit=dev --audit-level=high
