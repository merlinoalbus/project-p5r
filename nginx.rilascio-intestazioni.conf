# ============================================================
# nginx.rilascio-intestazioni.conf — intestazioni di sicurezza dell'istanza PUBBLICA di rilascio (L12, passo 9; L9-03)
# ============================================================
# Si include in ogni `location` che dichiara un suo `add_header`: in nginx un `add_header` dentro una location SOSTITUISCE quelli ereditati dal
# livello sopra, non si sommano. Il Dockerfile.frontend (stage `rilascio`) lo copia in /etc/nginx/snippets/intestazioni-sicurezza.conf.
#
# Due Content-Security-Policy, una che si applica e una che si osserva soltanto:
#   - `Content-Security-Policy` (applicata): le direttive che non hanno controindicazioni, nessun incorniciamento, nessun plugin, base e form
#     sulla stessa origine. Resta com'era;
#   - `Content-Security-Policy-Report-Only` (L9-03, solo rapporto): la policy completa, che il browser NON applica ma di cui segnala nella
#     console ogni violazione. Si passa alla versione applicata solo dopo averla osservata pulita nell'istanza vera, dietro il bordo, dove
#     possono comparire script che il bordo aggiunge da sé e che qui non si vedono.
# Le origini della policy completa vengono dal bundle e dal codice, non da un elenco generico (misura su una build di rilascio):
#   - script: solo i file del bundle in `/assets/` (index.html non ha script in linea);
#   - stili: i fogli del bundle e `'unsafe-inline'`, perché index.html porta lo <style> dell'anteprima d'avvio, i caratteri dell'utente
#     arrivano in un <style> generato (`src/stores/fontStore.ts`) e React scrive attributi `style`;
#   - immagini: la stessa origine (`/asset/`, `/api/immagini/…`) e `data:` (le immagini SVG generate in linea, `src/utils/pezziMappa.ts`);
#   - caratteri: `/font/` e `/api/font/…`, sulla stessa origine;
#   - connessioni: solo l'API sulla stessa origine (`/api/…`); manifesto dell'app sulla stessa origine;
#   - `frame-ancestors` resta solo nella policy applicata: in una policy di solo rapporto il browser lo ignora.
# Una violazione attesa: Zod prova `Function("")` per sapere se può compilare i suoi controlli e, se non può, ripiega da solo sulla via senza
# compilazione. Con la policy applicata quella prova fallisce senza danni; in solo rapporto compare come segnalazione di `script-src`.
# HSTS lo mette il bordo di Cloudflare (qui il traffico è HTTP interno alla rete dello stack).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
