# ============================================================
# nginx.rilascio-intestazioni.conf — intestazioni di sicurezza dell'istanza PUBBLICA di rilascio (L12, passo 9)
# ============================================================
# Si include in ogni `location` che dichiara un suo `add_header`: in nginx un `add_header` dentro una location SOSTITUISCE quelli ereditati dal
# livello sopra, non si sommano. Il Dockerfile.frontend (stage `rilascio`) lo copia in /etc/nginx/snippets/intestazioni-sicurezza.conf.
#
# Niente Content-Security-Policy completa: index.html porta uno <style> in linea (l'anteprima d'avvio) e una policy ristretta romperebbe la pagina
# senza poterla provare qui. Restano le direttive che non hanno controindicazioni: nessun incorniciamento, nessun plugin, base e form sulla
# stessa origine. HSTS lo mette il bordo di Cloudflare (qui il traffico è HTTP interno alla rete dello stack).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
