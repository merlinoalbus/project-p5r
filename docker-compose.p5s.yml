# ============================================================
# docker-compose.p5s — istanza parallela del branch newreview (https://p5s.nasmerlinoalbus.cloud)
# ============================================================
# Stack SEPARATO dalla produzione (docker-compose.yml, progetto «persona5royal»): container, rete interna e volumi propri, immagini
# col tag `:newreview` (workflow docker-publish-newreview.yml). Mandato dell'utente del 2026-10-20 (DECISIONI.md).
#
# Avvio sull'host (progetto «p5s», mai «persona5royal»):
#   docker compose -p p5s -f docker-compose.p5s.yml up -d
#
# Rete: come la produzione, nessuna porta pubblicata. Il frontend è sulla rete esterna del tunnel Cloudflare (`proxy`) col nome
# `project_p5r_review_fe`: l'hostname pubblico p5s.nasmerlinoalbus.cloud del tunnel punta a http://project_p5r_review_fe:80.
# nginx.conf dell'immagine cerca il backend come `project_p5r_be:3101`: sulla rete interna dello stack il backend di p5s porta
# l'alias `project_p5r_be`, quindi il frontend di p5s parla solo col suo backend (quello di produzione non è sulla rete `proxy`
# né su questa rete). Nessuna modifica all'immagine del frontend.
#
# Dati: il volume `p5s_data` parte da una copia dei dati di produzione presa con l'API di backup di SQLite (sola lettura sulla
# produzione); da lì vive per conto suo. La cartella d'appoggio è un volume locale `p5s_deposito`, non il NAS della produzione:
# esportazioni e backup di p5s non finiscono accanto a quelli veri.
#
# Watchtower: la label lo inserisce fra i container aggiornati dal watchtower globale, che segue il tag `:newreview`.

services:
  project_p5r_review_be:
    image: ghcr.io/merlinoalbus/project-p5r-backend:newreview
    container_name: project_p5r_review_be
    restart: unless-stopped
    expose:
      - "3101"
    environment:
      - DEPOSITO_DIR=/deposito
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - p5s_data:/data
      - p5s_deposito:/deposito
    networks:
      p5s_network:
        aliases:
          - project_p5r_be
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  project_p5r_review_fe:
    image: ghcr.io/merlinoalbus/project-p5r-frontend:newreview
    container_name: project_p5r_review_fe
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - project_p5r_review_be
    networks:
      - p5s_network
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  p5s_network:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  p5s_data:
    name: p5s_data
  p5s_deposito:
    name: p5s_deposito
