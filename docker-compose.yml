# ============================================================
# docker-compose — stack project-p5r (host Portainer, repo GitHub)
# ============================================================
# Rete: sull'host è esposto SOLO il frontend (13820); il backend è
# raggiungibile unicamente dal frontend nginx sulla rete interna, che
# proxa `/api/` verso `project_p5r_be:3101`. Il tunnel Cloudflare punta
# al frontend (configurazione lato Cloudflare a carico dell'utente).
# Porte host nel range 1382x (project-jira occupa 13810-13811,
# manhua 13800-13802).
#
# Watchtower: sull'host è attiva un'istanza GLOBALE esterna — qui NON
# si aggiunge alcun servizio watchtower: la label
# `com.centurylinklabs.watchtower.enable=true` inserisce i due
# container tra quelli monitorati per l'auto-update da GHCR (:latest).
#
# Il DB SQLite viene creato dal backend sul volume `project_p5r_data`
# al primo avvio (migrazioni + seed del compendio Royal inclusi
# nell'immagine); sopravvive agli aggiornamenti d'immagine.

services:
  project_p5r_be:
    image: ghcr.io/merlinoalbus/project-p5r-backend:latest
    container_name: project_p5r_be
    restart: unless-stopped
    # Nessuna porta host: solo la rete interna dello stack.
    expose:
      - "3101"
    environment:
      - PORT=3101
      - DATA_DIR=/data
      - SEED_DIR=/app/data/seed
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # DB SQLite + WAL + backups/ sopravvivono agli update di immagine.
      - project_p5r_data:/data
    networks:
      - project_p5r_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  project_p5r_fe:
    image: ghcr.io/merlinoalbus/project-p5r-frontend:latest
    container_name: project_p5r_fe
    restart: unless-stopped
    ports:
      - "13820:80"
    depends_on:
      - project_p5r_be
    networks:
      - project_p5r_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  project_p5r_network:
    driver: bridge

volumes:
  project_p5r_data:
