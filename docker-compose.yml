# ============================================================
# docker-compose — stack project-p5r (host Portainer, repo GitHub)
# ============================================================
# Rete: NESSUNA porta pubblicata sull'host.
#   - il backend vive solo sulla rete interna dello stack;
#   - il frontend nginx (che proxa `/api/` verso `project_p5r_be:3101`)
#     è collegato anche alla rete ESTERNA del reverse proxy/tunnel
#     Cloudflare (`PROXY_NETWORK`, default `proxy`): cloudflared lo
#     raggiunge come http://project_p5r_fe:80.
#   La rete esterna deve già esistere sull'host (docker network create proxy).
#
# Variabili di stack (tutte opzionali):
#   PROXY_NETWORK  nome della rete esterna del tunnel (default: proxy)
#   LOG_LEVEL      livello di log del backend (default: info)
#
# Watchtower: sull'host è attiva un'istanza GLOBALE esterna — qui NON
# si aggiunge alcun servizio watchtower: la label
# `com.centurylinklabs.watchtower.enable=true` inserisce i due
# container tra quelli monitorati per l'auto-update da GHCR (:latest).
#
# Il DB SQLite viene creato dal backend sul volume `project_p5r_data`
# al primo avvio (migrazioni + seed del compendio Royal inclusi
# nell'immagine); sopravvive agli aggiornamenti d'immagine.

services:
  project_p5r_be:
    image: ghcr.io/merlinoalbus/project-p5r-backend:latest
    container_name: project_p5r_be
    restart: unless-stopped
    expose:
      - "3101"
    environment:
      - PORT=3101
      - DATA_DIR=/data
      - SEED_DIR=/app/data/seed
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # DB SQLite + WAL + backups/ sopravvivono agli update di immagine.
      - project_p5r_data:/data
    networks:
      - project_p5r_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  project_p5r_fe:
    image: ghcr.io/merlinoalbus/project-p5r-frontend:latest
    container_name: project_p5r_fe
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - project_p5r_be
    networks:
      - project_p5r_network
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  project_p5r_network:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  project_p5r_data:
