# ============================================================
# docker-compose — stack project-p5r (host Portainer, repo GitHub)
# ============================================================
# Rete: NESSUNA porta pubblicata sull'host.
#   - il backend vive solo sulla rete interna dello stack;
#   - il frontend nginx (che proxa `/api/` verso `project_p5r_be:3101`)
#     è collegato anche alla rete ESTERNA del reverse proxy/tunnel
#     Cloudflare (`PROXY_NETWORK`, default `proxy`): cloudflared lo
#     raggiunge come http://project_p5r_fe:80.
#   La rete esterna deve già esistere sull'host (docker network create proxy).
#
# Variabili di stack:
#   PROXY_NETWORK  nome della rete esterna del tunnel (facoltativa, default: proxy)
#   LOG_LEVEL      livello di log del backend (facoltativa, default: info)
#   NAS_ADDR       indirizzo del NAS che ospita la cartella d'appoggio (OBBLIGATORIA)
#   NAS_PATH       percorso esportato via NFS (OBBLIGATORIA)
# NAS_ADDR e NAS_PATH non hanno più un valore predefinito: era l'indirizzo e il percorso del NAS di casa, scritti nel
# repository; senza le due variabili lo stack non parte e lo dice (rilievo D12 della verifica completa, 2026-10-04).
# Porta, cartella dei dati e del pacchetto iniziale stanno una volta sola, nell'immagine (Dockerfile.backend, rilievo D10).
#
# Limiti di memoria e di processi (L9-06), scelti dai consumi misurati e con margine, perché un errore o un uso scorretto non tolga risorse al
# resto dell'host:
#   - backend 4 GiB, 256 processi: a riposo usa circa 200 MiB e 27 processi (misura del 01/11 su un backend locale con una copia dei dati,
#     host da 24 CPU). Il limite viene dal caso più pesante che l'istanza accetta: l'importazione delle mappe fino a 512 MB di JSON (corpo,
#     testo e oggetti in memoria insieme), oltre a «Prepara edizione» (copie, VACUUM con le tabelle temporanee in memoria, miniature). Node
#     dentro 4 GiB si dà da solo circa 2,2 GiB di heap (misurato in node:24.22.1-alpine), abbastanza per quel JSON; con un limite più basso
#     l'importazione grande finirebbe senza memoria. I processi crescono con le CPU dell'host (thread di libuv, di V8 e di libvips);
#   - frontend 256 MiB, 128 processi: nginx usa circa 20 MiB e un processo per CPU più il master (25 su 24 CPU).
#
# Watchtower: sull'host è attiva un'istanza GLOBALE esterna — qui NON
# si aggiunge alcun servizio watchtower: la label
# `com.centurylinklabs.watchtower.enable=true` inserisce i due
# container tra quelli monitorati per l'auto-update da GHCR (:latest).
#
# Il DB SQLite viene creato dal backend sul volume `project_p5r_data`
# al primo avvio dal pacchetto iniziale (pacchetto/gioco.db, senza immagini) e
# migrato; le partite stanno in partite.db; entrambi sopravvivono agli
# aggiornamenti d'immagine.
#
# Il pacchetto COMPLETO (con le immagini, ~311 MB) arriva dalla CARTELLA D'APPOGGIO
# sul NAS, montata via NFS su /deposito: ci si deposita il file e da
# Impostazioni → Pacchetto di gioco si sceglie quale importare. Il browser non
# trasporta più nulla, quindi i limiti di corpo di nginx e del tunnel non contano.
#
# **Il NAS NON ospita /data, e non è una svista.** SQLite qui gira in modalità WAL,
# che ha bisogno di memoria condivisa fra i processi: i filesystem di rete non la
# forniscono e il database si corromperebbe o non si aprirebbe (è scritto anche
# nella documentazione di SQLite). Sul NAS sta solo il file di scambio; il database
# vivo resta sul volume locale.

services:
  project_p5r_be:
    image: ghcr.io/merlinoalbus/project-p5r-backend:latest
    container_name: project_p5r_be
    restart: unless-stopped
    expose:
      - "3101"
    environment:
      - DEPOSITO_DIR=/deposito
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # DB SQLite + WAL + backups/ sopravvivono agli update di immagine.
      - project_p5r_data:/data
      # cartella d'appoggio sul NAS: qui si deposita il pacchetto da importare (e qui l'app lo può esportare)
      - project_p5r_deposito:/deposito
    mem_limit: 4g
    pids_limit: 256
    networks:
      - project_p5r_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  project_p5r_fe:
    image: ghcr.io/merlinoalbus/project-p5r-frontend:latest
    container_name: project_p5r_fe
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - project_p5r_be
    mem_limit: 256m
    pids_limit: 128
    networks:
      - project_p5r_network
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  project_p5r_network:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  project_p5r_data:
  # Cartella d'appoggio sul NAS (NFS 4.1). `hard` + `timeo`/`retrans` fanno attendere invece di dare
  # errore quando il NAS è lento; `nconnect=8` e le finestre da 128 kB servono a un file da centinaia
  # di MB; `local_lock=all` perché il lock lo gestisce il client (qui il file si legge e si riscrive
  # per intero, non è un database aperto).
  project_p5r_deposito:
    driver: local
    driver_opts:
      type: nfs
      device: ":${NAS_PATH:?imposta NAS_PATH nelle variabili dello stack: il percorso esportato via NFS dal NAS}"
      o: "addr=${NAS_ADDR:?imposta NAS_ADDR nelle variabili dello stack: l'indirizzo del NAS},rw,nfsvers=4.1,hard,timeo=600,retrans=2,noatime,nodiratime,nconnect=8,rsize=131072,wsize=131072,actimeo=60,lookupcache=all,local_lock=all"
