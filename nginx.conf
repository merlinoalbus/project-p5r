# ============================================================
# nginx.conf — SPA react-router + proxy /api verso il backend
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Il backend si raggiunge per nome, risolto dal DNS di Docker a ogni richiesta (con 10 s di cache), non una volta sola
    # all'avvio: quando Watchtower ricrea il container del backend con un IP nuovo, nginx lo segue invece di rispondere 502
    # finché non viene riavviato anche lui (rilievo D1 della verifica completa, 2026-10-03). Con una variabile in `proxy_pass`
    # e nessun URI dopo l'indirizzo, nginx passa la richiesta così com'è, come prima.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://project_p5r_be:3101;

    # SPA fallback: ogni path del router risolve sul bundle unico.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html non va mai in cache (browser o CDN): deve puntare sempre ai bundle hashati più recenti.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Backup, ripristino e pacchetto di gioco: il corpo è un database intero (centinaia di MB) e il
    # server ci lavora per minuti (copia di sicurezza, migrazioni). Prefisso più lungo, quindi vince su
    # `^~ /api/`, che resta a 10 MB per tutto il resto. Attenzione: dietro un tunnel (Cloudflare) vale
    # comunque il limite del tunnel: per quel caso c'è l'importazione «da indirizzo», che manda solo l'URL.
    location ^~ /api/impostazioni/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 1024m;
    }

    # L'importazione delle mappe porta le immagini dentro il JSON: il server la accetta fino a 64 MB (`bootstrap.ts`), e qui
    # valeva il limite generale di 10 MB, quindi in produzione un pacchetto di mappe più grande riceveva 413 mentre in sviluppo
    # passava (rilievo D2 della verifica completa, 2026-10-03). Corrispondenza esatta: vince su `^~ /api/`.
    location = /api/mappe/importa {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 64m;
    }

    # ^~ così la regex degli asset statici non può MAI oscurare le API.
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le ricerche di alberi di fusione profondi possono durare.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 10M;
    }

    # Asset grafici predefiniti: nomi fissi (non hashati). Un'ora di cache piena e poi rivalidazione con ETag: le centinaia di
    # miniature del Compendio non vengono richieste a ogni visita; un asset nuovo compare entro un'ora (o con un ricaricamento forzato).
    location ^~ /asset/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Il build di Vite: nomi con l'hash del contenuto, quindi un file cambiato ha un nome nuovo e la cache può essere immutabile.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gli altri file statici hanno nomi fissi (`/favicon.svg`, i caratteri in `/font/`): «immutabile» li teneva vecchi per sette
    # giorni dopo una sostituzione. Stessa regola degli asset grafici: un'ora piena, poi rivalidazione (rilievo D4, 2026-10-03).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
}
