<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Installazione a schermo intero su telefono e tablet (L12, R12-03). Scelta dichiarata: niente service worker e niente cache offline.
      L'app vive di dati del backend che cambiano a ogni partita e di un bundle che si aggiorna a ogni rilascio: una cache offline
      servirebbe versioni vecchie senza che nessuno se ne accorga (c'è già «AvvisoNuovaVersione» per avvisare dell'aggiornamento).
      Il manifesto, da solo, basta a far installare l'app sulla schermata Home e ad aprirla senza barra del browser.
      `use-credentials`: dietro Cloudflare Access (istanza di rilascio) il manifesto si chiede con i cookie dell'accesso; senza,
      il browser lo chiederebbe anonimo e riceverebbe la pagina di login al posto del JSON.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- L'app ha il solo tema scuro: i due colori della barra di stato coincidono (colore della Topbar, `--color-bg-secondary`) -->
    <meta name="theme-color" content="#14141a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14141a" media="(prefers-color-scheme: dark)" />
    <!-- iOS (Safari non legge tutto il manifesto): icona della schermata Home, apertura a schermo intero, barra di stato nera.
         `black` e non `black-translucent`: la Topbar non riserva lo spazio della barra di stato (nessun safe-area-inset-top), con la
         translucent il logo finirebbe sotto l'orologio e la batteria -->
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="P5R" />
    <title>Project P5R — Compagno di gioco</title>
    <!--
      Anteprima d'avvio (lotto B, punto 9): mentre arrivano il bundle e /api/config (fino a 15 s) si vede subito il logo e
      «Caricamento…» invece di uno schermo nero. CSS in linea, colori del tema scritti a mano: il CSS dell'app non c'è ancora.
      Il montaggio di React (src/main.tsx) sostituisce il contenuto di #root; la stessa grafica la riusa SchermataAvvio
      (classi .avvio*), così il passaggio all'attesa del router non si nota.
    -->
    <style>
      html, body { margin: 0; background: #0b0b0e; color: #ececf1; }
      .avvio { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; background: #0b0b0e; color: #ececf1; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .avvio__logo { width: 64px; height: 64px; border-radius: 12px; background: #e5352b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 28px; letter-spacing: -0.02em; transform: rotate(-4deg); box-shadow: 0 6px 24px rgba(229, 53, 43, 0.35); }
      .avvio__anello { width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 3px solid #34343f; border-top-color: #e5352b; animation: avvio-giro 0.8s linear infinite; }
      .avvio__testo { margin: 0; font-size: 15px; color: #a3a3b3; }
      @keyframes avvio-giro { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        /* niente rotazione: l'anello resta fermo e a dire che si sta caricando basta il testo */
        .avvio__anello { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="avvio" role="status" aria-live="polite">
        <div class="avvio__logo" aria-hidden="true">P5</div>
        <div class="avvio__anello" aria-hidden="true"></div>
        <p class="avvio__testo">Caricamento…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
