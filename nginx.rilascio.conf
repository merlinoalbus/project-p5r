# ============================================================
# nginx.rilascio.conf — SPA + proxy /api dell'istanza PUBBLICA di rilascio, in sola lettura (L12, passo 9)
# ============================================================
# È la PRIMA delle tre difese sulle scritture (le altre due: il backend di rilascio, che monta solo l'elenco delle rotte del giocatore, e il database
# dei contenuti, aperto da un volume in sola lettura). Qui si tolgono in anticipo le strade che nel rilascio non esistono e si impone un limite alle altre:
#   - niente `/api/impostazioni/` (importazione, esportazione, deposito, backup, cestino dei contenuti), niente `/api/mappe/importa`, niente documentazione
#     delle API (`/api/docs`, `/api/openapi.json`): 404 senza arrivare al backend;
#   - fuori da `/api/partite` e `/api/condizioni` (le sole che scrivono: avanzamento di chi gioca) passano soltanto GET e HEAD: 405 per gli altri metodi;
#   - corpo massimo 256 kB (le partite sono piccole; il limite generale della preparazione, 10 MB, e quello dell'importazione, 512 MB, qui non servono);
#   - intestazioni di sicurezza (nginx.rilascio-intestazioni.conf).
# Il backend si raggiunge per nome DNS di Docker (`project_p5r_rilascio_be`, distinto da quello della preparazione: i due stack condividono la rete del
# tunnel). L'identità dell'utente non si decide qui: l'intestazione `Cf-Access-Jwt-Assertion` che Cloudflare Access aggiunge passa com'è e il backend
# ne verifica la firma, `iss`, `aud` e la scadenza.

# Quali percorsi dell'API scrivono: i soli dell'avanzamento di chi gioca.
map $uri $api_percorso_del_giocatore {
    default                 0;
    ~^/api/partite(/|$)     1;
    ~^/api/condizioni/      1;
}

# Metodo negato (1) o ammesso (0): ogni metodo sui percorsi del giocatore, solo GET e HEAD altrove.
map "$api_percorso_del_giocatore:$request_method" $api_metodo_negato {
    default     1;
    ~^1:        0;
    "0:GET"     0;
    "0:HEAD"    0;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Il corpo di una richiesta: 256 kB bastano all'avanzamento della partita (rilievo del progetto, §6).
    client_max_body_size 256k;

    # Il backend si raggiunge per nome, risolto dal DNS di Docker a ogni richiesta (10 s di cache): se il container viene ricreato con un IP nuovo
    # nginx lo segue, invece di rispondere 502 finché non lo si riavvia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://project_p5r_rilascio_be:3101;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/intestazioni-sicurezza.conf;

    # SPA fallback: ogni path del router risolve sul bundle unico.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html non va mai in cache: deve puntare sempre ai bundle hashati più recenti.
    location = /index.html {
        include /etc/nginx/snippets/intestazioni-sicurezza.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- Strade che nel rilascio non esistono: 404 JSON nella stessa forma dell'API, senza arrivare al backend ----
    location ^~ /api/impostazioni/ {
        default_type application/json;
        return 404 '{"error":{"code":"not-found","message":"Funzione non disponibile in questa istanza."}}';
    }
    location = /api/mappe/importa {
        default_type application/json;
        return 404 '{"error":{"code":"not-found","message":"Funzione non disponibile in questa istanza."}}';
    }
    location ^~ /api/docs {
        default_type application/json;
        return 404 '{"error":{"code":"not-found","message":"Funzione non disponibile in questa istanza."}}';
    }
    location = /api/openapi.json {
        default_type application/json;
        return 404 '{"error":{"code":"not-found","message":"Funzione non disponibile in questa istanza."}}';
    }

    # ^~ così la regex degli asset statici non può MAI oscurare le API.
    location ^~ /api/ {
        # vale solo per le risposte generate da nginx (il 405 qui sotto): quelle del backend portano il loro Content-Type
        default_type application/json;
        if ($api_metodo_negato) {
            return 405 '{"error":{"code":"metodo-non-ammesso","message":"Questa istanza è in sola lettura."}}';
        }
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le ricerche di alberi di fusione profondi possono durare, ma qui non c'è nulla che richieda minuti.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;
        include /etc/nginx/snippets/intestazioni-sicurezza.conf;
    }

    # Asset grafici predefiniti: nomi fissi (non hashati). Un'ora di cache piena e poi rivalidazione con ETag.
    location ^~ /asset/ {
        include /etc/nginx/snippets/intestazioni-sicurezza.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Il build di Vite: nomi con l'hash del contenuto, quindi un file cambiato ha un nome nuovo e la cache può essere immutabile.
    location ^~ /assets/ {
        include /etc/nginx/snippets/intestazioni-sicurezza.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gli altri file statici hanno nomi fissi (`/favicon.svg`, i caratteri in `/font/`): un'ora piena, poi rivalidazione.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/intestazioni-sicurezza.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
}
