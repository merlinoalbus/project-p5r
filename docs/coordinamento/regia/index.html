<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regia p5s</title>
<style>
  :root {
    --bg: #0b0b0e; --bg2: #14141a; --bg3: #1c1c24; --bordo: #2a2a34; --testo: #f2f2f5; --testo2: #a9a9b6; --testo3: #6e6e7c;
    --rosso: #e5191c; --oro: #ffd23f; --verde: #3ecf8e; --blu: #5aa9ff; --arancio: #ff9f43; --grigio: #3a3a46;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--testo); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; background: linear-gradient(100deg, var(--rosso) 0 6px, var(--bg2) 6px); border-bottom: 1px solid var(--bordo); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--testo2); font-weight: 700; }
  h3 { margin: 0 0 6px; font-size: 15px; overflow-wrap: anywhere; }
  .obiettivo { color: var(--testo2); font-size: 13px; max-width: 80ch; margin: 4px 0 0; }
  .fresco { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: #17432f; color: var(--verde); white-space: nowrap; }
  .fresco.vecchio { background: #4a1416; color: #ff7779; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1400px; }
  @media (min-width: 1100px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .largo { grid-column: 1 / -1; } }
  .card { background: var(--bg2); border: 1px solid var(--bordo); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  p { margin: 6px 0; }
  ul { margin: 6px 0; padding-left: 20px; }
  li + li { margin-top: 4px; }
  .grande { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .percento { font-size: 44px; font-weight: 800; line-height: 1; }
  .barra { height: 12px; border-radius: 99px; background: var(--grigio); overflow: hidden; display: flex; flex: 1 1 260px; min-width: 0; }
  .barra i { display: block; height: 100%; }
  .b-chiuso { background: var(--verde); } .b-codice { background: #2a9d6c; } .b-corso { background: var(--blu); } .b-attesa { background: var(--oro); }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--testo2); margin-top: 10px; }
  .legenda i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .lotti { display: grid; gap: 6px; margin-top: 14px; }
  .lotto { display: grid; grid-template-columns: 46px minmax(0, 1fr) 120px; gap: 10px; align-items: center; font-size: 13px; }
  .lotto b { font-size: 14px; }
  .lotto span { color: var(--testo2); text-align: right; white-space: nowrap; }
  .lotto .barra { height: 9px; }
  .testo-agg { font-size: 15px; }
  .persone { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin-top: 10px; }
  .persona { background: var(--bg3); border: 1px solid var(--bordo); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
  .persona dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; font-size: 13px; }
  .persona dt { color: var(--testo2); } .persona dd { margin: 0; overflow-wrap: anywhere; }
  .decisioni li { color: var(--oro); }
  .sess { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--bordo); }
  .sess:last-child { border-bottom: 0; }
  .sess .att { flex-basis: 100%; color: var(--testo2); font-size: 13px; overflow-wrap: anywhere; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--grigio); color: var(--testo); white-space: nowrap; }
  .pill.ok { background: #17432f; color: var(--verde); } .pill.attesa { background: #4a3018; color: var(--arancio); } .pill.errore { background: #4a1416; color: #ff7779; }
  details { border-top: 1px solid var(--bordo); padding: 8px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .voce { padding: 6px 0 6px 10px; border-left: 3px solid var(--grigio); margin: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
  .voce.chiuso { border-left-color: var(--verde); } .voce.codice { border-left-color: #2a9d6c; } .voce.corso { border-left-color: var(--blu); } .voce.utente { border-left-color: var(--oro); }
  .voce .crit { color: var(--testo2); }
  input[type="search"] { width: 100%; max-width: 420px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--bordo); background: var(--bg3); color: var(--testo); font: inherit; margin-bottom: 8px; }
  .nota { color: var(--testo2); font-size: 13px; overflow-wrap: anywhere; }
  .errore { color: #ff7779; background: var(--bg2); border: 1px solid var(--rosso); border-radius: 8px; padding: 10px 12px; margin: 12px 20px 0; }
  footer { color: var(--testo3); font-size: 12px; padding: 0 20px 20px; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { header, main { padding-left: 12px; padding-right: 12px; } .percento { font-size: 34px; } .lotto { grid-template-columns: 40px minmax(0, 1fr); } .lotto span { grid-column: 2; text-align: left; } .persona dl { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <div><h1>Regia p5s</h1><p class="obiettivo" id="obiettivo"></p></div>
  <span class="fresco" id="fresco">…</span>
</header>
<p id="errore" class="errore" role="alert" hidden></p>
<main>
  <section class="card largo" aria-labelledby="t-complessivo">
    <h2 id="t-complessivo">A che punto siamo</h2>
    <div id="complessivo"></div>
  </section>
  <section class="card largo" aria-labelledby="t-agg">
    <h2 id="t-agg">Ultimo aggiornamento</h2>
    <div id="aggiornamento"></div>
  </section>
  <section class="card" aria-labelledby="t-decisioni">
    <h2 id="t-decisioni">Serve una tua decisione</h2>
    <div id="decisioni"></div>
  </section>
  <section class="card" aria-labelledby="t-sessioni">
    <h2 id="t-sessioni">Chi lavora e con quale modello</h2>
    <p class="nota" id="sessioni-quando"></p>
    <p class="nota">Regola: lo sviluppo va su Sonnet o Haiku, la verifica su Opus.</p>
    <div id="sessioni"></div>
  </section>
  <section class="card largo" aria-labelledby="t-voci">
    <h2 id="t-voci">Tutte le voci del piano, per lotto</h2>
    <input type="search" id="filtro" placeholder="Cerca una voce (id, titolo, stato)…" aria-label="Cerca una voce del piano">
    <div id="voci"></div>
  </section>
  <section class="card largo" aria-labelledby="t-storico">
    <h2 id="t-storico">Aggiornamenti precedenti</h2>
    <div id="storico"></div>
  </section>
</main>
<footer id="piede"></footer>
<script>
  // Stato delle voci del piano tradotto in parole e raggruppato in quattro famiglie leggibili.
  const STATI = {
    'chiuso': ['Chiusa', 'chiuso'], 'chiuso-codice': ['Fatta nel codice, da verificare e pubblicare', 'codice'],
    'in-corso': ['In lavorazione', 'corso'], 'incompleto': ['Ferma, incompleta', 'corso'],
    'attesa-utente': ['Aspetta una tua decisione', 'utente'], 'riservato-utente': ['Riservata a te', 'utente'],
    'da-riscontrare': ['Da riscontrare', ''], 'da-fare': ['Da fare', ''],
  };
  const TITOLI_LOTTO = {};
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const arr = (v) => Array.isArray(v) ? v : [];
  const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
  const quando = (iso) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const minutiFa = (iso) => { const d = new Date(iso); return isNaN(d) ? null : Math.round((Date.now() - d.getTime()) / 60000); };
  // Lotti in ordine numerico (L5, L6 … L11), le voci di Regia in fondo.
  const ordinaLotti = (m) => [...m].sort(([a], [b]) => (parseInt(a.slice(1), 10) || 99) - (parseInt(b.slice(1), 10) || 99));
  let stato = null, agg = null, ultimoStato = '', ultimoAgg = '', aperti = new Set();

  function conteggi(voci) {
    const c = { chiuso: 0, codice: 0, corso: 0, utente: 0, resto: 0 };
    for (const v of voci) { const f = (STATI[v.stato] || ['', ''])[1]; if (f in c) c[f]++; else c.resto++; }
    return c;
  }
  function barra(c, tot) {
    return `<div class="barra" role="img" aria-label="${pct(c.chiuso + c.codice, tot)}% chiuso"><i class="b-chiuso" style="width:${pct(c.chiuso, tot)}%"></i><i class="b-codice" style="width:${pct(c.codice, tot)}%"></i><i class="b-corso" style="width:${pct(c.corso, tot)}%"></i><i class="b-attesa" style="width:${pct(c.utente, tot)}%"></i></div>`;
  }

  function disegnaStato() {
    const voci = arr(stato.pianoAtomico?.voci);
    for (const l of arr(stato.lotti)) TITOLI_LOTTO[l.id] = l.titolo;
    document.getElementById('obiettivo').textContent = stato.obiettivo || '';
    const c = conteggi(voci), tot = voci.length;
    const perLotto = new Map();
    for (const v of voci) { if (!perLotto.has(v.lotto)) perLotto.set(v.lotto, []); perLotto.get(v.lotto).push(v); }
    document.getElementById('complessivo').innerHTML =
      `<div class="grande"><span class="percento">${pct(c.chiuso + c.codice, tot)}%</span>${barra(c, tot)}</div>`
      + `<p>${c.chiuso + c.codice} voci chiuse su ${tot}: ${c.chiuso} chiuse (riscontrate o pubblicate) e ${c.codice} fatte nel codice, ancora da verificare e pubblicare. ${c.corso} in lavorazione, ${c.utente} aspettano te, ${c.resto} da fare o da riscontrare.</p>`
      + `<div class="legenda"><span><i class="b-chiuso"></i>chiusa</span><span><i class="b-codice"></i>fatta nel codice</span><span><i class="b-corso"></i>in lavorazione</span><span><i class="b-attesa"></i>aspetta te</span><span><i style="background:var(--grigio)"></i>da fare</span></div>`
      + `<div class="lotti">${ordinaLotti(perLotto).map(([l, vv]) => { const k = conteggi(vv); return `<div class="lotto"><b>${esc(l)}</b>${barra(k, vv.length)}<span>${pct(k.chiuso + k.codice, vv.length)}% · ${k.chiuso + k.codice}/${vv.length}</span></div>`; }).join('')}</div>`;

    document.getElementById('sessioni').innerHTML = arr(stato.sessioni).map((s) => {
      const m = s.modello || '';
      const fuori = s.ruolo === 'sviluppo' && !/sonnet|haiku/.test(m) ? 'lo sviluppo va su Sonnet o Haiku' : s.ruolo === 'verifica' && !/opus/.test(m) ? 'la verifica va su Opus' : '';
      const cls = s.stato === 'al lavoro' ? 'ok' : s.stato === 'in attesa' ? 'attesa' : '';
      return `<div class="sess"><b>${esc(s.nome)}</b><span class="pill ${cls}">${esc(s.stato)}</span><span class="pill ${fuori ? 'errore' : ''}">${esc(m.replace(/^claude-/, '') || 'modello ignoto')}</span>${fuori ? `<span class="pill errore">✕ ${esc(fuori)}</span>` : ''}<div class="att">${esc(s.attivita)}</div></div>`;
    }).join('') || '<p class="nota">Nessuna sessione registrata.</p>';

    disegnaVoci();
  }

  function disegnaVoci() {
    const voci = arr(stato?.pianoAtomico?.voci), q = document.getElementById('filtro').value.trim().toLowerCase();
    const perLotto = new Map();
    for (const v of voci) {
      if (q && !`${v.id} ${v.titolo} ${(STATI[v.stato] || [v.stato])[0]}`.toLowerCase().includes(q)) continue;
      if (!perLotto.has(v.lotto)) perLotto.set(v.lotto, []); perLotto.get(v.lotto).push(v);
    }
    const box = document.getElementById('voci');
    box.querySelectorAll('details[open]').forEach((d) => aperti.add(d.dataset.lotto));
    box.innerHTML = ordinaLotti(perLotto).map(([l, vv]) => {
      const k = conteggi(vv), apri = aperti.has(l) || (q && vv.length <= 60);
      // Le voci aperte vengono prima: lavorazione, decisioni tue, da fare; le chiuse in fondo.
      const ordine = { corso: 0, utente: 1, '': 2, codice: 3, chiuso: 4 };
      const ord = [...vv].sort((a, b) => (ordine[(STATI[a.stato] || ['', ''])[1]] ?? 2) - (ordine[(STATI[b.stato] || ['', ''])[1]] ?? 2));
      return `<details data-lotto="${esc(l)}" ${apri ? 'open' : ''}><summary>${esc(l)}${TITOLI_LOTTO[l] ? ` · ${esc(TITOLI_LOTTO[l])}` : ''} <span class="pill">${k.chiuso + k.codice}/${vv.length} chiuse</span>${k.corso ? `<span class="pill ok">${k.corso} in lavorazione</span>` : ''}${k.utente ? `<span class="pill attesa">${k.utente} aspettano te</span>` : ''}</summary>`
        + (apri ? ord.slice(0, 400).map((v) => `<div class="voce ${(STATI[v.stato] || ['', ''])[1]}"><b>${esc(v.titolo)}</b> <span class="pill">${esc((STATI[v.stato] || [v.stato])[0])}</span><div class="crit">${esc(v.id)}${v.criterio ? ` — ${esc(v.criterio)}` : ''}</div></div>`).join('') + (ord.length > 400 ? `<p class="nota">Mostrate le prime 400 di ${ord.length}: usa la ricerca per restringere.</p>` : '') : '')
        + '</details>';
    }).join('') || '<p class="nota">Nessuna voce corrisponde alla ricerca.</p>';
    box.querySelectorAll('details').forEach((d) => d.addEventListener('toggle', () => { if (d.open) aperti.add(d.dataset.lotto); else aperti.delete(d.dataset.lotto); if (d.open && !d.querySelector('.voce')) disegnaVoci(); }));
  }

  function persona(p) {
    return `<div class="persona"><h3>${esc(p.chi)}</h3><dl><dt>Adesso</dt><dd>${esc(p.adesso)}</dd><dt>Fatto</dt><dd>${esc(p.fatto)}</dd><dt>Prossimo</dt><dd>${esc(p.prossimo)}</dd></dl></div>`;
  }
  function disegnaAgg() {
    const ultimi = arr(agg?.ultimi), u = ultimi[0];
    const fr = document.getElementById('fresco');
    if (!u) { fr.textContent = 'Nessun aggiornamento'; fr.className = 'fresco vecchio'; document.getElementById('aggiornamento').innerHTML = '<p class="nota">Il PM non ha ancora pubblicato aggiornamenti.</p>'; return; }
    const m = minutiFa(u.ora);
    fr.textContent = `Aggiornato alle ${quando(u.ora)}${m !== null ? ` · ${m} min fa` : ''}`;
    fr.className = `fresco ${m !== null && m > 12 ? 'vecchio' : ''}`;
    fr.title = m !== null && m > 12 ? 'Più di 10 minuti fa: l’aggiornamento è in ritardo' : 'Aggiornamento puntuale';
    document.getElementById('aggiornamento').innerHTML = `<p class="testo-agg">${esc(u.complessivo)}</p><div class="persone">${arr(u.puntuale).map(persona).join('')}</div>`;
    // Le decisioni sono quelle dell'ultimo aggiornamento: un elenco vuoto vuol dire «niente da decidere», non «guarda le vecchie»
    const dec = Array.isArray(u.decisioni) ? u.decisioni : arr(stato?.inAttesaUtente);
    document.getElementById('decisioni').innerHTML = dec.length ? `<ul class="decisioni">${dec.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : '<p class="nota">Niente da decidere adesso.</p>';
    document.getElementById('storico').innerHTML = ultimi.slice(1).map((x) => `<details><summary>${esc(quando(x.ora))}</summary><p>${esc(x.complessivo)}</p><div class="persone">${arr(x.puntuale).map(persona).join('')}</div></details>`).join('') || '<p class="nota">Nessun aggiornamento precedente.</p>';
  }

  async function leggi(url) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    try { const r = await fetch(url, { cache: 'no-store', signal: ctl.signal }); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return await r.text(); } finally { clearTimeout(t); }
  }
  async function aggiorna() {
    const err = document.getElementById('errore');
    try {
      const [s, a] = await Promise.all([leggi('/stato.json'), leggi('/aggiornamenti.json').catch(() => '{}')]);
      if (s !== ultimoStato) { stato = JSON.parse(s); ultimoStato = s; disegnaStato(); }
      if (a !== ultimoAgg) { agg = JSON.parse(a); ultimoAgg = a; }
      disegnaAgg();
      err.hidden = true;
      document.getElementById('piede').textContent = `Lavagna aggiornata il ${stato?.aggiornato || '—'} · pagina riletta alle ${new Date().toLocaleTimeString('it-IT')} (ogni 10 secondi)`;
    } catch (e) {
      err.textContent = `Non leggo la lavagna: ${e instanceof Error ? e.message : String(e)}. ${stato ? 'Quello che vedi è l’ultima lettura riuscita.' : ''}`;
      err.hidden = false;
    }
  }
  document.getElementById('filtro').addEventListener('input', () => disegnaVoci());
  aggiorna();
  setInterval(aggiorna, 10000);
</script>
</body>
</html>
