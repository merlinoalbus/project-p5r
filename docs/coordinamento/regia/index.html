<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regia p5s</title>
<style>
  :root {
    --bg: #0b0b0e; --bg2: #14141a; --bg3: #1c1c24; --bordo: #2a2a34; --testo: #f2f2f5; --testo2: #a9a9b6; --testo3: #6e6e7c;
    --rosso: #e5191c; --oro: #ffd23f; --verde: #3ecf8e; --blu: #5aa9ff; --arancio: #ff9f43; --grigio: #3a3a46;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--testo); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 20px; background: linear-gradient(100deg, var(--rosso) 0 6px, var(--bg2) 6px); border-bottom: 1px solid var(--bordo); }
  h1 { margin: 0; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--testo2); font-weight: 700; }
  .obiettivo { color: var(--testo2); font-size: 13px; max-width: 70ch; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) { main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } .largo { grid-column: 1 / -1; } }
  .card { background: var(--bg2); border: 1px solid var(--bordo); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .attivita-corrente { font-size: 17px; font-weight: 700; margin: 0 0 10px; overflow-wrap: anywhere; }
  .schede { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .residuo { background: var(--bg3); border: 1px solid var(--bordo); border-radius: 8px; padding: 12px; min-width: 0; }
  h3 { margin: 0 0 8px; font-size: 15px; overflow-wrap: anywhere; }
  dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; }
  dt { color: var(--testo2); }
  dd { margin: 0; overflow-wrap: anywhere; }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 20px; }
  li + li { margin-top: 5px; }
  .passo { border-top: 1px solid var(--bordo); padding-top: 8px; }
  .elenco-chiusi { color: var(--verde); }
  .conteggi { margin-top: 12px; color: var(--testo2); font-size: 12px; }
  .scorre { overflow-x: auto; overscroll-behavior-x: contain; }
  table { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 640px; }
  th { font-size: 11px; color: var(--testo3); font-weight: 600; text-align: center; padding: 2px; white-space: nowrap; }
  th.lotto, td.lotto { text-align: left; white-space: nowrap; }
  td.lotto b { display: inline-block; min-width: 30px; }
  td.lotto span { color: var(--testo2); font-size: 12px; }
  td.cella { height: 26px; border-radius: 4px; text-align: center; font-size: 12px; }
  .s-fatta { background: var(--verde); color: #08130d; }
  .s-in-corso { background: var(--blu); color: #06121f; }
  .s-difetti { background: var(--rosso); color: #fff; }
  .s-bloccata { background: var(--arancio); color: #1d1004; }
  .s-da-fare { background: var(--grigio); color: var(--testo3); }
  .legenda { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--testo2); }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .nota { color: var(--testo2); font-size: 12px; overflow-wrap: anywhere; }
  .note-lotti { display: grid; gap: 12px; margin-top: 14px; }
  .note-lotti p { margin: 4px 0 0; }
  summary { cursor: pointer; font-weight: 700; }
  details[open] > summary { margin-bottom: 12px; }
  .sessioni { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
  .sess { background: var(--bg3); border: 1px solid var(--bordo); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .sess .nome { font-weight: 700; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
  .stato { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--grigio); color: var(--testo); }
  .stato.lavoro { background: #17432f; color: var(--verde); }
  .stato.attesa { background: #4a3018; color: var(--arancio); }
  .att { color: var(--testo2); font-size: 12px; min-height: 1.4em; overflow-wrap: anywhere; }
  .attese { color: var(--oro); }
  a { color: var(--oro); overflow-wrap: anywhere; }
  footer { color: var(--testo3); font-size: 12px; padding: 0 20px 20px; }
  .errore { color: #ff7779; background: var(--bg2); border: 1px solid var(--rosso); border-radius: 8px; padding: 10px 12px; margin: 12px 20px 0; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { header { padding: 10px 12px; } h1 { font-size: 19px; } main { padding: 12px; gap: 12px; } .card { padding: 12px; } dl { grid-template-columns: minmax(0, 1fr); gap: 3px; } dd + dt { margin-top: 5px; } .errore { margin: 12px 12px 0; } footer { padding: 0 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Regia p5s</h1>
  <div class="obiettivo" id="obiettivo"></div>
</header>
<p id="errore" class="errore" role="alert" hidden></p>
<main>
  <section class="card" aria-labelledby="titolo-adesso">
    <h2 id="titolo-adesso">Adesso</h2>
    <div id="adesso"></div>
  </section>
  <section class="card" aria-labelledby="titolo-consegna">
    <h2 id="titolo-consegna">Ultima consegna</h2>
    <div id="consegna"></div>
  </section>
  <section class="card largo" aria-labelledby="titolo-mancanti">
    <h2 id="titolo-mancanti">Cosa manca</h2>
    <div class="schede" id="mancanti"></div>
    <p class="conteggi" id="nota-conteggi"></p>
  </section>
  <section class="card" aria-labelledby="titolo-chiusi">
    <h2 id="titolo-chiusi">Già chiuso</h2>
    <div id="chiusi"></div>
  </section>
  <section class="card" aria-labelledby="titolo-decisioni">
    <h2 id="titolo-decisioni">Decisioni dell’utente</h2>
    <div id="decisioni"></div>
  </section>
  <section class="card largo" aria-labelledby="titolo-sessioni">
    <h2 id="titolo-sessioni">Sessioni del team</h2>
    <div class="sessioni" id="sessioni"></div>
  </section>
  <section class="card largo">
    <details id="storico">
      <summary id="apri-storico">Storico dei lotti e delle fasi</summary>
      <div class="scorre" id="scorrimento-matrice" tabindex="0" aria-label="Matrice storica dei lotti, scorrimento orizzontale"><table id="matrice"></table></div>
      <div class="legenda">
        <span><i class="s-fatta"></i>fatta</span><span><i class="s-in-corso"></i>in corso</span><span><i class="s-difetti"></i>difetti / correzioni</span>
        <span><i class="s-bloccata"></i>bloccata</span><span><i class="s-da-fare"></i>da fare</span>
      </div>
      <div class="note-lotti" id="note-lotti"></div>
    </details>
  </section>
</main>
<footer id="piede"></footer>
<script>
  const SIGLA = { requisiti: 'Requisiti', dati: 'Dati', app: 'App', modifiche: 'Modifiche', be: 'BE', fe: 'FE', funzionali: 'Funzionali',
    ux: 'UX', noreg: 'No-reg', layout: 'Layout', validazione: 'Validaz.', consegna: 'Consegna' };
  const ETICHETTA = { 'fatta': 'fatta', 'in-corso': 'in corso', 'difetti': 'difetti', 'bloccata': 'bloccata', 'da-fare': 'da fare' };
  const oggetto = (v) => v !== null && typeof v === 'object' && !Array.isArray(v) ? v : {};
  const elenco = (v) => Array.isArray(v) ? v : [];
  const testo = (v) => typeof v === 'string' || typeof v === 'number' ? String(v) : '';
  const stringhe = (v) => elenco(v).map(testo).filter(Boolean);
  const st = (s) => typeof s === 'string' && Object.hasOwn(ETICHETTA, s) ? s : 'da-fare';
  const fase = (s) => typeof s === 'string' && Object.hasOwn(SIGLA, s) ? SIGLA[s] : testo(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const lista = (v, classe = '') => stringhe(v).length ? `<ul class="${classe}">${stringhe(v).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '';
  function collegamento(v, chiave) {
    const o = oggetto(v), valore = testo(v) || testo(o.testo) || testo(o.url);
    const url = testo(o.url) || valore;
    try {
      const u = new URL(url);
      if (u.protocol === 'http:' || u.protocol === 'https:') {
        return `<a href="${esc(u.href)}" target="_blank" rel="noreferrer" data-focus-key="${esc(chiave)}">${esc(valore)}</a>`;
      }
    } catch { /* Un valore descrittivo resta testo. */ }
    return esc(valore);
  }
  const riga = (etichetta, valore, chiave) => testo(valore) || Object.keys(oggetto(valore)).length
    ? `<dt>${esc(etichetta)}</dt><dd>${collegamento(valore, chiave)}</dd>` : '';
  const decisione = (titolo, v) => `<h3>${esc(titolo)}</h3>` + (Array.isArray(v)
    ? lista(v, 'attese') || '<p>Nessuna registrata.</p>' : '<p class="nota">Non indicate nel file.</p>');
  let ultimoJson = null, ultimiDati = null, letturaInCorso = false, ultimaLettura = null;

  function disegna(r) {
    const aperti = new Map(Array.from(document.querySelectorAll('details[id]'), (d) => [d.id, d.open]));
    const attivo = document.activeElement;
    const focus = { id: attivo?.id, chiave: attivo?.dataset?.focusKey };
    const scroll = { x: window.scrollX, y: window.scrollY, matrice: document.getElementById('scorrimento-matrice').scrollLeft };
    const fasi = stringhe(r.fasi), lotti = elenco(r.lotti).map(oggetto), c = oggetto(r.cruscotto);
    const adesso = oggetto(c.adesso), consegna = oggetto(c.ultimaConsegna), decisioni = oggetto(c.decisioni);
    document.getElementById('obiettivo').textContent = testo(r.obiettivo);
    document.getElementById('adesso').innerHTML = `<p class="attivita-corrente">${esc(testo(adesso.attivita) || testo(r.mandatoCorrente))}</p>`
      + `<dl>${riga('Stato', adesso.stato, 'adesso-stato')}${riga('Responsabile', adesso.responsabile, 'adesso-responsabile')}`
      + `${riga('Prossima consegna', adesso.prossimaConsegna, 'adesso-prossima')}</dl>`;
    document.getElementById('consegna').innerHTML = Object.keys(consegna).length
      ? `<h3>${esc(testo(consegna.titolo))}</h3><dl>${riga('Commit', consegna.commit, 'consegna-commit')}`
        + `${riga('Pipeline', consegna.pipeline, 'consegna-pipeline')}${riga('Istanza', consegna.istanza, 'consegna-istanza')}`
        + `${riga('Verifica', consegna.verifica, 'consegna-verifica')}</dl>`
      : `<p class="nota">Il file non descrive l’ultima consegna separatamente.</p><dl>${riga('Istanza', oggetto(r.p5s).url, 'istanza-storica')}`
        + `${riga('Stato registrato', oggetto(r.p5s).stato, 'stato-storico')}</dl>`;

    const mancanti = Array.isArray(c.mancanti) ? c.mancanti.map(oggetto)
      : lotti.filter((l) => /^L(?:[5-9]|10|11)$/.test(testo(l.id)) && st(oggetto(l.fasi).consegna) !== 'fatta').map((l) => ({
        lotto: l.id, titolo: l.titolo, stato: ETICHETTA[st(oggetto(l.fasi).consegna)], cosaManca: stringhe([l.nota])
      }));
    document.getElementById('mancanti').innerHTML = mancanti.map((m) => `<article class="residuo"><h3>${esc(testo(m.lotto))} · ${esc(testo(m.titolo))}</h3>`
      + (testo(m.stato) ? `<span class="stato">${esc(testo(m.stato))}</span>` : '') + lista(m.cosaManca)
      + (testo(m.prossimoPasso) ? `<p class="passo"><b>Prossimo passo:</b> ${esc(testo(m.prossimoPasso))}</p>` : '') + '</article>').join('');
    document.getElementById('nota-conteggi').textContent = testo(c.notaConteggi) || 'Il file non contiene un conteggio deduplicato dei residui.';
    document.getElementById('chiusi').innerHTML = lista(c.chiusi, 'elenco-chiusi') || '<p class="nota">Nessun elenco separato di chiusure presente nel file.</p>';
    document.getElementById('decisioni').innerHTML = Object.hasOwn(decisioni, 'bloccantiOra') || Object.hasOwn(decisioni, 'future')
      ? decisione('Bloccanti adesso', decisioni.bloccantiOra) + decisione('Decisioni future', decisioni.future)
      : lista(r.inAttesaUtente, 'attese') || '<p class="nota">Nessuna decisione registrata nel file.</p>';

    document.getElementById('sessioni').innerHTML = elenco(r.sessioni).map(oggetto).map((s) => {
      const cls = s.stato === 'al lavoro' ? 'lavoro' : s.stato === 'in attesa' ? 'attesa' : '';
      return `<div class="sess"><div class="nome">${esc(testo(s.nome))}<span class="stato ${cls}">${esc(testo(s.stato))}</span></div>`
        + `<div class="att">${esc(testo(s.attivita))}</div></div>`;
    }).join('');

    document.getElementById('matrice').innerHTML = `<thead><tr><th class="lotto" scope="col">Lotto</th>${fasi.map((f) => `<th scope="col">${esc(fase(f))}</th>`).join('')}</tr></thead><tbody>`
      + lotti.map((l) => `<tr><th class="lotto" scope="row"><b>${esc(testo(l.id))}</b> <span>${esc(testo(l.titolo))}</span></th>`
        + fasi.map((f) => { const s = st(oggetto(l.fasi)[f]); return `<td class="cella s-${s}" title="${esc(`${testo(l.id)} · ${fase(f)}: ${ETICHETTA[s]}`)}" aria-label="${esc(ETICHETTA[s])}">${s === 'fatta' ? '✓' : s === 'difetti' ? '!' : s === 'in-corso' ? '…' : s === 'bloccata' ? '×' : '—'}</td>`; }).join('') + '</tr>').join('') + '</tbody>';
    document.getElementById('note-lotti').innerHTML = lotti.filter((l) => testo(l.nota)).map((l) => `<div><b>${esc(testo(l.id))} · ${esc(testo(l.titolo))}</b><p class="nota">${esc(testo(l.nota))}</p></div>`).join('');
    for (const [id, aperto] of aperti) { const d = document.getElementById(id); if (d) d.open = aperto; }
    const ripristinaFocus = focus.id ? document.getElementById(focus.id)
      : focus.chiave ? Array.from(document.querySelectorAll('[data-focus-key]')).find((e) => e.dataset.focusKey === focus.chiave) : null;
    ripristinaFocus?.focus({ preventScroll: true });
    document.getElementById('scorrimento-matrice').scrollLeft = scroll.matrice;
    window.scrollTo(scroll.x, scroll.y);
  }

  function aggiornaPiede() {
    document.getElementById('piede').textContent = ultimiDati
      ? `Dati aggiornati: ${testo(ultimiDati.aggiornato) || 'data non indicata nel file'} · Ultima lettura riuscita: ${ultimaLettura.toLocaleString('it-IT')} · Lettura automatica ogni 10 secondi`
      : 'Nessun dato letto. Lettura automatica ogni 10 secondi.';
  }

  async function aggiorna() {
    if (letturaInCorso) return;
    letturaInCorso = true;
    const richiesta = new AbortController();
    const scadenza = setTimeout(() => richiesta.abort(), 8000);
    try {
      const risposta = await fetch('/stato.json', { cache: 'no-store', signal: richiesta.signal });
      if (!risposta.ok) throw new Error(`HTTP ${risposta.status}`);
      const r = await risposta.json();
      if (r === null || typeof r !== 'object' || Array.isArray(r)) throw new Error('Il file non contiene un oggetto JSON valido.');
      if (!Array.isArray(r.fasi) || !Array.isArray(r.lotti) || !Array.isArray(r.sessioni)) throw new Error('Struttura della lavagna incompleta: mancano fasi, lotti o sessioni.');
      const json = JSON.stringify(r);
      if (json !== ultimoJson) disegna(r);
      ultimoJson = json;
      ultimiDati = r;
      ultimaLettura = new Date();
      document.getElementById('errore').hidden = true;
      aggiornaPiede();
    } catch (e) {
      const errore = document.getElementById('errore');
      errore.textContent = `Non leggo la lavagna: ${e instanceof Error ? e.message : String(e)} ${ultimiDati ? 'I dati visibili sono quelli dell’ultima lettura riuscita e NON sono aggiornati.' : 'Nessun dato disponibile.'}`;
      errore.hidden = false;
      aggiornaPiede();
    } finally {
      clearTimeout(scadenza);
      letturaInCorso = false;
    }
  }
  aggiorna();
  setInterval(aggiorna, 10000);
</script>
</body>
</html>
