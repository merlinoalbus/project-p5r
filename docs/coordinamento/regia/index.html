<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regia p5s</title>
<style>
  :root {
    --bg: #0b0b0e; --bg2: #14141a; --bg3: #1c1c24; --bordo: #2a2a34; --testo: #f2f2f5; --testo2: #a9a9b6; --testo3: #6e6e7c;
    --rosso: #e5191c; --oro: #ffd23f; --verde: #3ecf8e; --blu: #5aa9ff; --arancio: #ff9f43; --grigio: #3a3a46;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--testo); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 18px 20px; background: linear-gradient(100deg, var(--rosso) 0 6px, var(--bg2) 6px); border-bottom: 1px solid var(--bordo); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--testo2); font-weight: 700; }
  .obiettivo { color: var(--testo2); font-size: 13px; max-width: 70ch; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) { main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } .largo { grid-column: 1 / -1; } }
  .card { background: var(--bg2); border: 1px solid var(--bordo); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .anello { position: relative; width: 112px; height: 112px; flex: none; }
  .anello svg { transform: rotate(-90deg); }
  .anello b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
  .kpi { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .kpi div { background: var(--bg3); border: 1px solid var(--bordo); border-radius: 8px; padding: 6px 12px; }
  .kpi strong { display: block; font-size: 18px; }
  .kpi span { color: var(--testo3); font-size: 12px; }
  .scorre { overflow-x: auto; overscroll-behavior-x: contain; }
  table { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 640px; }
  th { font-size: 11px; color: var(--testo3); font-weight: 600; text-align: center; padding: 2px; white-space: nowrap; }
  th.lotto, td.lotto { text-align: left; white-space: nowrap; }
  td.lotto b { display: inline-block; min-width: 30px; }
  td.lotto span { color: var(--testo2); font-size: 12px; }
  td.cella { height: 26px; border-radius: 4px; text-align: center; font-size: 12px; }
  .s-fatta { background: var(--verde); color: #08130d; }
  .s-in-corso { background: var(--blu); color: #06121f; }
  .s-difetti { background: var(--rosso); color: #fff; }
  .s-bloccata { background: var(--arancio); color: #1d1004; }
  .s-da-fare { background: var(--grigio); color: var(--testo3); }
  td.pct { font-variant-numeric: tabular-nums; color: var(--testo2); text-align: right; padding-left: 6px; font-size: 12px; }
  .legenda { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--testo2); }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .nota { color: var(--testo3); font-size: 12px; }
  .sessioni { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
  .sess { background: var(--bg3); border: 1px solid var(--bordo); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .sess .nome { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .stato { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--grigio); color: var(--testo2); white-space: nowrap; }
  .stato.lavoro { background: color-mix(in srgb, var(--verde) 25%, transparent); color: var(--verde); }
  .stato.attesa { background: color-mix(in srgb, var(--arancio) 25%, transparent); color: var(--arancio); }
  .att { color: var(--testo2); font-size: 12px; min-height: 1.4em; }
  .barra { display: grid; grid-template-columns: 58px 1fr 38px; align-items: center; gap: 6px; font-size: 11px; color: var(--testo3); }
  .barra > div { height: 8px; background: var(--grigio); border-radius: 99px; overflow: hidden; }
  .barra > div > i { display: block; height: 100%; border-radius: 99px; }
  .barra .a { background: var(--blu); } .barra .p { background: var(--verde); }
  .barra em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--testo2); }
  ul.attese { margin: 0; padding-left: 18px; color: var(--oro); }
  a { color: var(--oro); }
  footer { color: var(--testo3); font-size: 12px; padding: 0 20px 20px; }
  .errore { color: var(--rosso); }
</style>
</head>
<body>
<header>
  <div class="anello" id="anello"></div>
  <div>
    <h1>Regia p5s · piano complessivo</h1>
    <div class="obiettivo" id="obiettivo"></div>
    <div class="kpi" id="kpi"></div>
  </div>
</header>
<main>
  <section class="card largo">
    <h2>Lotti × fasi</h2>
    <div class="scorre"><table id="matrice"></table></div>
    <div class="legenda">
      <span><i class="s-fatta"></i>fatta</span><span><i class="s-in-corso"></i>in corso</span><span><i class="s-difetti"></i>difetti / correzioni</span>
      <span><i class="s-bloccata"></i>bloccata</span><span><i class="s-da-fare"></i>da fare</span>
    </div>
  </section>
  <section class="card">
    <h2>Sessioni del team</h2>
    <div class="sessioni" id="sessioni"></div>
  </section>
  <section class="card">
    <h2>In attesa di te</h2>
    <ul class="attese" id="attese"></ul>
    <h2 style="margin-top:16px">Istanza p5s</h2>
    <div id="p5s"></div>
  </section>
</main>
<footer id="piede"></footer>
<script>
  const PESO = { 'fatta': 1, 'in-corso': 0.5, 'difetti': 0.5, 'bloccata': 0.25, 'da-fare': 0 };
  const SIGLA = { requisiti: 'Requisiti', dati: 'Dati', app: 'App', modifiche: 'Modifiche', be: 'BE', fe: 'FE', funzionali: 'Funzionali',
    ux: 'UX', noreg: 'No-reg', layout: 'Layout', validazione: 'Validaz.', consegna: 'Consegna' };
  const ETICHETTA = { 'fatta': 'fatta', 'in-corso': 'in corso', 'difetti': 'difetti', 'bloccata': 'bloccata', 'da-fare': 'da fare' };
  const st = (s) => (s in PESO ? s : 'da-fare');
  const media = (v) => v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100) : 0;
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function anello(pct) {
    const r = 48, c = 2 * Math.PI * r;
    return `<svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" stroke="#3a3a46" stroke-width="10"/>`
      + `<circle cx="56" cy="56" r="${r}" fill="none" stroke="#e5191c" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}"/></svg><b>${pct}%</b>`;
  }
  function barra(etichetta, pct, cls) {
    return `<div class="barra"><span>${etichetta}</span><div><i class="${cls}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></div><em>${pct}%</em></div>`;
  }

  function disegna(r) {
    const fasi = r.fasi;
    const piano = media(r.lotti.flatMap((l) => fasi.map((f) => PESO[st(l.fasi[f])])));
    const consegnati = r.lotti.filter((l) => st(l.fasi.consegna) === 'fatta').length;
    const inLavoro = r.sessioni.filter((s) => s.stato === 'al lavoro').length;
    const difetti = r.lotti.reduce((n, l) => n + fasi.filter((f) => st(l.fasi[f]) === 'difetti').length, 0);
    document.getElementById('anello').innerHTML = anello(piano);
    document.getElementById('obiettivo').textContent = r.obiettivo;
    document.getElementById('kpi').innerHTML =
      `<div><strong>${consegnati}/${r.lotti.length}</strong><span>lotti consegnati</span></div>`
      + `<div><strong>${inLavoro}/${r.sessioni.length}</strong><span>sessioni al lavoro</span></div>`
      + `<div><strong>${difetti}</strong><span>fasi con difetti</span></div>`;

    let t = `<tr><th class="lotto">Lotto</th>${fasi.map((f) => `<th>${SIGLA[f] || f}</th>`).join('')}<th>%</th></tr>`;
    for (const l of r.lotti) {
      const pct = media(fasi.map((f) => PESO[st(l.fasi[f])]));
      t += `<tr><td class="lotto" title="${esc(l.nota)}"><b>${esc(l.id)}</b> <span>${esc(l.titolo)}</span></td>`
        + fasi.map((f) => { const s = st(l.fasi[f]); return `<td class="cella s-${s}" title="${esc(l.id)} · ${SIGLA[f] || f}: ${ETICHETTA[s]}">${s === 'fatta' ? '✓' : s === 'difetti' ? '!' : s === 'in-corso' ? '…' : ''}</td>`; }).join('')
        + `<td class="pct">${pct}%</td></tr>`;
    }
    document.getElementById('matrice').innerHTML = t;

    document.getElementById('sessioni').innerHTML = r.sessioni.map((s) => {
      const sue = String(s.fase || '').split(',').map((x) => x.trim()).filter((f) => fasi.includes(f));
      const sulPiano = media(r.lotti.flatMap((l) => sue.map((f) => PESO[st(l.fasi[f])])));
      const cls = s.stato === 'al lavoro' ? 'lavoro' : s.stato === 'in attesa' ? 'attesa' : '';
      return `<div class="sess"><div class="nome">${esc(s.nome)}<span class="stato ${cls}">${esc(s.stato)}</span></div>`
        + `<div class="att">${esc(s.attivita) || '—'}</div>`
        + barra('attività', Number(s.avanzamento ?? 0), 'a') + barra('piano', sulPiano, 'p') + `</div>`;
    }).join('');

    document.getElementById('attese').innerHTML = (r.inAttesaUtente || []).map((a) => `<li>${esc(a)}</li>`).join('') || '<li style="color:var(--testo3)">niente</li>';
    document.getElementById('p5s').innerHTML = `<a href="${esc(r.p5s.url)}" target="_blank" rel="noreferrer">${esc(r.p5s.url)}</a><div class="nota">${esc(r.p5s.stato)}</div>`;
    document.getElementById('piede').textContent = `Lavagna aggiornata il ${r.aggiornato} · letta alle ${new Date().toLocaleTimeString('it-IT')} · si aggiorna ogni 10 secondi`;
  }

  async function aggiorna() {
    try {
      const r = await (await fetch('/stato.json', { cache: 'no-store' })).json();
      disegna(r);
    } catch (e) {
      document.getElementById('piede').innerHTML = `<span class="errore">Non leggo la lavagna: ${esc(e.message)}</span>`;
    }
  }
  aggiorna();
  setInterval(aggiorna, 10000);
</script>
</body>
</html>
